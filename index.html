<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Haptic Dot Noise</title>
<style>
  :root { --bg:#0b0b0f; --panel:rgba(18,18,24,.92); --text:#f2f0ec; --dim:#a19e98; --accent:#ff7333; --line:rgba(255,255,255,.12); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; touch-action:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hidden-video { position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; left:0; top:0; }

  #intro { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px 16px;
    background:rgba(11,11,15,.94); z-index:10; overflow-y:auto; touch-action:pan-y; }
  #intro .card { width:100%; max-width:420px; }
  h1 { font-size:26px; letter-spacing:.02em; margin:0 0 6px; }
  p.sub { color:var(--dim); margin:0 0 22px; }
  .slot { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line);
    border-radius:12px; margin-bottom:10px; cursor:pointer; }
  .slot .t { flex:1; min-width:0; }
  .slot .t b { display:block; font-weight:600; }
  .slot .t span { display:block; color:var(--dim); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .slot .pick { color:var(--accent); font-weight:600; font-size:14px; }
  .slot input { display:none; }
  button.primary { width:100%; margin-top:14px; padding:15px; border:0; border-radius:12px; background:var(--accent);
    color:#1a0d05; font:600 17px system-ui,sans-serif; cursor:pointer; }
  .note { color:var(--dim); font-size:12.5px; margin-top:14px; }

  #gear { position:fixed; right:max(14px, env(safe-area-inset-right)); bottom:max(14px, env(safe-area-inset-bottom));
    width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:var(--text);
    font-size:22px; z-index:5; display:none; cursor:pointer; }
  #panel { position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--panel); border-top:1px solid var(--line);
    padding:16px 16px max(18px, env(safe-area-inset-bottom)); transform:translateY(105%); transition:transform .25s ease;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); touch-action:pan-y; }
  #panel.open { transform:none; }
  #panel .row { display:flex; align-items:center; gap:12px; margin:10px 0; }
  #panel label { width:110px; color:var(--dim); font-size:14px; }
  #panel input[type=range] { flex:1; accent-color:var(--accent); }
  #panel .btns { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  #panel .btns button { flex:1; min-width:120px; padding:11px; border-radius:10px; border:1px solid var(--line);
    background:transparent; color:var(--text); font:500 14px system-ui,sans-serif; cursor:pointer; }
  #readout { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>

<div id="intro">
  <div class="card">
    <h1>Haptic Dot Noise</h1>
    <p class="sub">Tilt your phone to move a window between two videos while noise warps the background.</p>

    <label class="slot"><div class="t"><b>Dot video</b><span data-for="dot">Plays inside the moving dot</span></div>
      <span class="pick">Choose</span><input type="file" accept="video/*" data-slot="dot"></label>
    <label class="slot"><div class="t"><b>Background video</b><span data-for="bg">Plays behind the dot</span></div>
      <span class="pick">Choose</span><input type="file" accept="video/*" data-slot="bg"></label>
    <label class="slot"><div class="t"><b>Distortion video <span style="display:inline;color:var(--dim);font-weight:400">(optional)</span></b><span data-for="map">Warps the noise pattern</span></div>
      <span class="pick">Choose</span><input type="file" accept="video/*" data-slot="map"></label>

    <button class="primary" id="start">Start</button>
    <p class="note">Your videos stay on your phone. Nothing is uploaded anywhere. If you skip a video, a placeholder pattern is used. On a computer, move the mouse to simulate tilt.</p>
  </div>
</div>

<button id="gear" aria-label="Settings">⚙</button>
<div id="panel">
  <div class="row"><label for="radius">Dot size</label><input id="radius" type="range" min="0.03" max="0.4" step="0.005" value="0.08"></div>
  <div class="row"><label for="strength">Distortion</label><input id="strength" type="range" min="0" max="1.5" step="0.01" value="1"></div>
  <div class="row"><label for="speed">Noise motion</label><input id="speed" type="range" min="0" max="1" step="0.01" value="0.15"></div>
  <div class="row"><label for="smooth">Smoothing</label><input id="smooth" type="range" min="0" max="0.5" step="0.01" value="0.1"></div>
  <div id="readout">Tilt: waiting for sensor…</div>
  <div class="btns">
    <button id="calibrate">Set current tilt as centre</button>
    <button id="reset">Reset centre</button>
    <button id="change">Change videos</button>
    <button id="close">Close</button>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ---------- Renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// ---------- Placeholder textures ----------
function placeholder(c1, c2, stripes) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 256, 256);
  grad.addColorStop(0, c1); grad.addColorStop(1, c2);
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  if (stripes) { g.globalAlpha = .18; g.fillStyle = '#fff'; for (let i = 0; i < 256; i += 16) g.fillRect(i, 0, 6, 256); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const slots = {
  dot: { tex: placeholder('#ff9a4a', '#ff4f2e', false), w: 1, h: 1, video: null },
  bg:  { tex: placeholder('#1c2a44', '#0d0f1a', true),  w: 1, h: 1, video: null },
  map: { tex: placeholder('#808080', '#808080', false), w: 1, h: 1, video: null },
};

// ---------- Shader ----------
const uniforms = {
  uDot: { value: slots.dot.tex }, uBg: { value: slots.bg.tex }, uMap: { value: slots.map.tex },
  uHasMap: { value: 0 },
  uRes: { value: new THREE.Vector2(innerWidth, innerHeight) },
  uDotAR: { value: 1 }, uBgAR: { value: 1 }, uMapAR: { value: 1 },
  uCenter: { value: new THREE.Vector2(0.5, 0.5) },
  uRadius: { value: 0.08 },
  uStrength: { value: 1.0 },
  uHarm: { value: 1 }, uSpread: { value: 2 }, uGain: { value: 0.7 },
  uTime: { value: 0 },
};

const frag = /* glsl */`
precision highp float;
varying vec2 vUv;
uniform sampler2D uDot, uBg, uMap;
uniform float uHasMap, uDotAR, uBgAR, uMapAR, uRadius, uStrength, uHarm, uSpread, uGain, uTime;
uniform vec2 uRes, uCenter;

// Simplex 3D noise (Ashima Arts / Stefan Gustavson, MIT)
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+10.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.5-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 105.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}

// Layered noise like TouchDesigner's Noise TOP: Harmonics = extra layers,
// Spread = frequency step per layer, Gain = strength of each extra layer.
float fbm(vec3 p){
  float sum = snoise(p), amp = 1.0, freq = 1.0;
  for (int i = 0; i < 8; i++) {
    if (float(i) >= uHarm) break;
    freq *= uSpread; amp *= uGain;
    sum += amp * snoise(p * freq);
  }
  return sum;
}

// "Fit outside" (cover) the screen with a texture of the given aspect ratio
vec2 cover(vec2 uv, float texAR){
  float screenAR = uRes.x / uRes.y;
  vec2 s = screenAR > texAR ? vec2(1.0, texAR / screenAR) : vec2(screenAR / texAR, 1.0);
  return (uv - 0.5) * s + 0.5;
}

void main(){
  vec2 uv = vUv;
  float ar = uRes.x / uRes.y;

  // 1. Distortion video warps where the noise is sampled (TD: displace2)
  vec2 warp = vec2(0.0);
  if (uHasMap > 0.5) warp = texture2D(uMap, cover(uv, uMapAR)).rg - 0.5;
  vec2 q = uv + warp;
  vec3 p = vec3(q * vec2(ar, 1.0), uTime);

  // 2. Two noise channels, like the Noise TOP's red and green (amplitude 0.5)
  vec2 n = 0.5 * vec2(fbm(p), fbm(p + vec3(17.3, -9.1, 4.7)));
  n = clamp(n, -0.5, 0.5);

  // 3. Noise pushes the background around (TD: displace1)
  vec2 bgUv = clamp(cover(uv, uBgAR) + n * uStrength, 0.0, 1.0);
  vec3 bg = texture2D(uBg, bgUv).rgb;

  // 4. Dot video, full-frame, seen through the moving circle (TD: matte)
  vec3 dotCol = texture2D(uDot, cover(uv, uDotAR)).rgb;
  float minDim = min(uRes.x, uRes.y);
  float d = length((uv - uCenter) * uRes) / minDim;
  float edge = 1.5 / minDim;
  float mask = 1.0 - smoothstep(uRadius - edge, uRadius + edge, d);

  gl_FragColor = vec4(mix(bg, dotCol, mask), 1.0);
}`;

const material = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: frag,
});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

// ---------- Video loading ----------
function loadVideo(slotName, file) {
  const s = slots[slotName];
  if (s.video) { s.video.pause(); URL.revokeObjectURL(s.video.src); s.video.remove(); }
  const v = document.createElement('video');
  v.className = 'hidden-video';
  v.muted = true; v.loop = true; v.playsInline = true;
  v.setAttribute('playsinline', ''); v.setAttribute('muted', ''); v.setAttribute('webkit-playsinline', '');
  v.src = URL.createObjectURL(file);
  document.body.appendChild(v);
  const tex = new THREE.VideoTexture(v);
  tex.colorSpace = slotName === 'map' ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  v.addEventListener('loadedmetadata', () => {
    s.w = v.videoWidth || 1; s.h = v.videoHeight || 1;
    uniforms[{dot:'uDotAR', bg:'uBgAR', map:'uMapAR'}[slotName]].value = s.w / s.h;
  });
  s.video = v; s.tex = tex;
  uniforms[{dot:'uDot', bg:'uBg', map:'uMap'}[slotName]].value = tex;
  if (slotName === 'map') uniforms.uHasMap.value = 1;
  return v;
}

document.querySelectorAll('input[type=file]').forEach(inp => {
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const slot = inp.dataset.slot;
    loadVideo(slot, f);
    document.querySelector(`[data-for="${slot}"]`).textContent = f.name;
    if (slot === 'map') speedEl.value = 0; // match the TD project: the distortion video provides the motion
  });
});

// ---------- Tilt input ----------
const raw = { x: 0, y: 0 };          // normalised -1..1, x = left/right, y = toward/away
const neutral = { x: 0, y: 0 };
const smooth = { x: 0, y: 0 };
let gotSensor = false;
const clamp1 = v => Math.max(-1, Math.min(1, v));

function onOrientation(e) {
  if (e.beta == null || e.gamma == null) return;
  gotSensor = true;
  let beta = e.beta, gamma = e.gamma;
  const angle = (screen.orientation && screen.orientation.angle) ?? (window.orientation || 0);
  let x = gamma, y = beta;                          // portrait
  if (angle === 90)  { x = beta;  y = -gamma; }     // landscape, rotated left
  if (angle === -90 || angle === 270) { x = -beta; y = gamma; }
  if (angle === 180) { x = -gamma; y = -beta; }
  raw.x = x / 90; raw.y = y / 90;
}

async function enableSensors() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const r = await DeviceOrientationEvent.requestPermission();   // iPhone / iPad
      if (r !== 'granted') alertMsg('Motion access was declined. Reload the page and tap Allow to use tilt.');
    }
  } catch (err) { /* not supported: fall back to pointer */ }
  window.addEventListener('deviceorientation', onOrientation);
}

// Mouse / finger fallback when there is no sensor (e.g. on a computer)
window.addEventListener('pointermove', e => {
  if (gotSensor || panel.classList.contains('open')) return;
  raw.x = (e.clientX / innerWidth) * 2 - 1;
  raw.y = (e.clientY / innerHeight) * 2 - 1;
});

// ---------- UI ----------
const intro = document.getElementById('intro');
const gear = document.getElementById('gear');
const panel = document.getElementById('panel');
const readout = document.getElementById('readout');
const radiusEl = document.getElementById('radius');
const strengthEl = document.getElementById('strength');
const speedEl = document.getElementById('speed');
const smoothEl = document.getElementById('smooth');
function alertMsg(m) { readout.textContent = m; panel.classList.add('open'); }

document.getElementById('start').addEventListener('click', async () => {
  await enableSensors();
  Object.values(slots).forEach(s => s.video && s.video.play().catch(() => {}));
  intro.style.display = 'none';
  gear.style.display = 'block';
  if (document.documentElement.requestFullscreen && matchMedia('(pointer:coarse)').matches) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
});
gear.addEventListener('click', () => panel.classList.toggle('open'));
document.getElementById('close').addEventListener('click', () => panel.classList.remove('open'));
document.getElementById('calibrate').addEventListener('click', () => { neutral.x = raw.x; neutral.y = raw.y; });
document.getElementById('reset').addEventListener('click', () => { neutral.x = 0; neutral.y = 0; });
document.getElementById('change').addEventListener('click', () => {
  panel.classList.remove('open'); gear.style.display = 'none'; intro.style.display = 'flex';
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) Object.values(slots).forEach(s => s.video && s.video.play().catch(() => {}));
});

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uRes.value.set(innerWidth, innerHeight);
});

// ---------- Loop ----------
const clock = new THREE.Clock();
let last = performance.now(), frames = 0, fps = 0, lastUi = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  const now = performance.now();

  // Lag, like TD's Lag CHOP
  const lag = parseFloat(smoothEl.value);
  const k = lag <= 0 ? 1 : 1 - Math.exp(-dt / lag);
  const tx = clamp1(raw.x - neutral.x), ty = clamp1(raw.y - neutral.y);
  smooth.x += (tx - smooth.x) * k;
  smooth.y += (ty - smooth.y) * k;
  const g = smooth.x, b = smooth.y;

  // Dot position (TD: circle centre = tilt / 90 * 0.45)
  uniforms.uCenter.value.set(0.5 + g * 0.45, 0.5 - b * 0.45);

  // Noise controls (same mapping as the TD project)
  uniforms.uHarm.value   = Math.round(1 + (g + 1) / 2 * 7);
  uniforms.uSpread.value = 1 + (b + 1) / 2 * 3;
  uniforms.uGain.value   = 0.2 + 0.8 * Math.min(1, Math.hypot(g, b));

  uniforms.uRadius.value = parseFloat(radiusEl.value);
  uniforms.uStrength.value = parseFloat(strengthEl.value);
  uniforms.uTime.value += dt * parseFloat(speedEl.value);

  renderer.render(scene, camera);

  frames++;
  if (now - last > 1000) { fps = Math.round(frames * 1000 / (now - last)); frames = 0; last = now; }
  if (panel.classList.contains('open') && now - lastUi > 200) {
    lastUi = now;
    readout.textContent = `${gotSensor ? 'Tilt' : 'Pointer'}  x ${g.toFixed(2)}  y ${b.toFixed(2)}   ·   harmonics ${uniforms.uHarm.value}  spread ${uniforms.uSpread.value.toFixed(2)}  gain ${uniforms.uGain.value.toFixed(2)}   ·   ${fps} fps`;
  }
});
</script>
</body>
</html>
